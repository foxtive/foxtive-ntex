[package]
name = "foxtive-ntex-multipart"
version = "1.0.1"
edition = "2024"
license = "MIT"
description = "Multipart form data parser for ntex"
repository = "https://github.com/foxtive/foxtive-ntex"
authors = ["ahmard"]

[features]
default = []
uuid = ["dep:uuid"]

[dependencies]
futures = { version = "0.3.34", default-features = false }
ntex-multipart = "3.2.0"
ntex = { workspace = true }
foxtive = { workspace = true }
thiserror = { workspace = true }
serde_json = "1.0.151"
uuid = { version = "1.24.1", default-features = false, features = ["v4"], optional = true }
tokio = { version = "1.53.1", default-features = false, features = [
    "fs",
    "io-util",
] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util", "macros"] }
uuid = { version = "1.24.1", default-features = false, features = ["v4"] }

[[example]]
name = "uuid"
path = "examples/uuid_support.rs"
required-features = ["uuid"]

[[example]]
name = "custom-type"
path = "examples/custom_types.rs"
