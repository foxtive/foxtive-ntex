[package]
name = "foxtive-ntex-multipart"
version = "0.8.2"
edition = "2024"
license = "MIT"
description = "Library For Handling File Uploads Based on Ntex"
repository = "https://github.com/foxtive/foxtive-ntex"
authors = ["ahmard"]

[features]
default = []
uuid = ["dep:uuid"]

[dependencies]
futures = { version = "0.3.31", default-features = false }
ntex-multipart = "2.0.0"
ntex = { workspace = true }
foxtive = { workspace = true }
thiserror = { workspace = true }
serde_json = "1.0.145"
uuid = { version = "1.19.0", default-features = false, features = ["v4"], optional = true }
tokio = { version = "1.48.0", default-features = false, features = [
    "fs",
    "io-util",
] }

[dev-dependencies]
tokio = { version = "1.47.1", features = ["test-util", "macros"] }

[[example]]
name = "uuid"
path = "examples/uuid_support.rs"
required-features = ["uuid"]

[[example]]
name = "custom-type"
path = "examples/custom_types.rs"
