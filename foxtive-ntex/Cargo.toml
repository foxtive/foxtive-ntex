[package]
name = "foxtive-ntex"
version = "0.30.0"
edition = "2024"
license = "MIT"
description = "Micro-Framework Based on Ntex"
repository = "https://github.com/foxtive/foxtive-ntex"
authors = ["ahmard"]

[features]
strum = ["dep:strum"]
static = ["dep:ntex-files"]
validator = ["dep:validator"]
database = ["foxtive/database"]
jwt = ["foxtive/jwt", "dep:jsonwebtoken"]
multipart = ["foxtive-ntex-multipart"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = { workspace = true }
tracing = { version = "0.1.44" }
uuid = { version = "1.23.0", default-features = false }
serde = { version = "1.0.228", default-features = false }
tokio = { version = "1.50.0", default-features = false, features = ["signal", "macros"] }
serde_json = { version = "1.0.149", default-features = false }
futures-util = { version = "0.3.32", default-features = false }
ntex = { workspace = true }
ntex-files = { version = "3.2.0", optional = true }
ntex-cors = { version = "3.2.1" }
jsonwebtoken = { version = "10.3.0", optional = true, features = ["rust_crypto"] }
validator = { version = "0.20.0", features = ["derive"], optional = true }
strum = { version = "0.28.0", optional = true, default-features = false }

foxtive = { workspace = true, features = ["http"] }
foxtive-ntex-multipart = { version = "0", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.50.0", features = ["test-util", "macros"] }
ntex = { workspace = true, default-features = false, features = ["tokio"] }
