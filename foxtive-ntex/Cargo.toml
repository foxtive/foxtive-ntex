[package]
name = "foxtive-ntex"
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Web framework built on Foxtive and ntex"
repository = "https://github.com/foxtive/foxtive-ntex"
authors = ["ahmard"]

[features]
strum = ["dep:strum"]
static = ["dep:ntex-files"]
validator = ["dep:validator"]
database = ["foxtive/database"]
jwt = ["foxtive/jwt", "dep:jsonwebtoken"]
multipart = ["foxtive-ntex-multipart"]
openssl = ["dep:ntex-tls", "dep:openssl"]
rustls = ["dep:ntex-tls", "dep:rustls"]

[dependencies]
thiserror = { workspace = true }
tracing = { version = "0.1.44" }
uuid = { version = "1.24.0", default-features = false }
serde = { version = "1.0.229", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = ["signal", "macros"] }
serde_json = { version = "1.0.151", default-features = false }
futures-util = { version = "0.3.33", default-features = false }
num_cpus = "1.16"
ntex = { workspace = true }
ntex-files = { version = "3.2.0", optional = true }
ntex-cors = { version = "3.2.1" }
ntex-tls = { version = "3", optional = true }
openssl = { version = "0.10", optional = true }
rustls = { version = "0.23", optional = true }
jsonwebtoken = { version = "10.4.0", optional = true, features = ["rust_crypto"] }
validator = { version = "0.21.0", features = ["derive"], optional = true }
strum = { version = "0.28.0", optional = true, default-features = false }

foxtive = { workspace = true, features = ["http", "tracing-setup"] }
async-trait = { version = "0.1.91" }
foxtive-ntex-multipart = { version = "1", path = "../foxtive-ntex-multipart", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util", "macros"] }
ntex = { workspace = true, default-features = false, features = ["tokio"] }
